name: Release NativeCrew
# Push a tag vX.Y.Z (matching package.json) to publish the packed plugin as a
# GitHub release. Installed NativeCrews find it through the releases API, check the
# archive against the SHA-256 GitHub records for it (and the .sha256 beside it),
# and install it through DSH's plugin manager.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, such as v0.2.0
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: Check the tag names the package version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm install -g pnpm@11.1.2 @deepseek-ai/dsh@$(node -p "require('./package.json').engines.dsh")
      - run: npm ci
      - name: Install Chromium matched to the locked Playwright version
        run: npx --no-install playwright-core install --no-shell chromium
      - run: npm test
      - run: npm run build
      - name: Pack the plugin
        shell: bash
        run: |
          mkdir -p dist
          package=$(npm pack --pack-destination dist --silent)
          test "$package" = "dsh-plugins-nativecrew-$VERSION.tgz"
          (cd dist && shasum -a 256 "$package" > "$package.sha256" && cat "$package.sha256")
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/dsh-plugins-nativecrew-$VERSION.tgz" "dist/dsh-plugins-nativecrew-$VERSION.tgz.sha256" --clobber
          else
            gh release create "$TAG" "dist/dsh-plugins-nativecrew-$VERSION.tgz" "dist/dsh-plugins-nativecrew-$VERSION.tgz.sha256" \
              --title "NativeCrew $VERSION" --generate-notes --verify-tag "${flags[@]}"
          fi
